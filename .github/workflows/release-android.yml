name: Release Android

# Publish an APK to GitHub Releases:  git tag android-v0.1.0 && git push origin android-v0.1.0
# The in-app updater reads these releases. Release notes come from mobile/release-notes/<version>.md.
on:
  push:
    tags: ['android-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"
          test -f "mobile/release-notes/$VERSION.md" || { echo "Missing mobile/release-notes/$VERSION.md"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - name: Build web assets and sync into the Android project
        working-directory: apps/web
        run: |
          npm ci
          npx ng build
          npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zenigma.keystore"

      - name: Assemble signed release APK
        working-directory: apps/web/android
        env:
          ZENIGMA_KEYSTORE_PATH: ${{ runner.temp }}/zenigma.keystore
          ZENIGMA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ZENIGMA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ZENIGMA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PversionName=${{ steps.v.outputs.version }} -PversionCode=${{ steps.v.outputs.code }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="Zenigma-${{ steps.v.outputs.version }}.apk"
          cp apps/web/android/app/build/outputs/apk/release/*.apk "$APK"
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "Zenigma ${{ steps.v.outputs.version }}" \
            --notes-file "mobile/release-notes/${{ steps.v.outputs.version }}.md"
