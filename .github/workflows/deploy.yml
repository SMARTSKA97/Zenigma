name: Deploy

# Runs on every push to main. Order matters: database first, then the API (which expects the new schema),
# then the web app. Render's own auto-deploy must be OFF so the API only ever deploys after its migrations.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate database (Flyway to Neon)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Flyway migrate
        run: >
          docker run --rm -v "${{ github.workspace }}/db/migrations:/flyway/sql:ro"
          flyway/flyway:11
          -url="${{ secrets.FLYWAY_URL }}" -user="${{ secrets.FLYWAY_USER }}" -password="${{ secrets.FLYWAY_PASSWORD }}"
          -connectRetries=10 migrate

  api:
    name: Deploy API (Render)
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy hook
        run: curl --fail-with-body -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  web:
    name: Deploy web (Cloudflare Pages)
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx ng build
      - name: Publish to Cloudflare Pages
        run: npx wrangler@4 pages deploy dist/web/browser --project-name=zenigma --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
