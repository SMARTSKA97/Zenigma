name: Deploy

# Runs on every push to main, but only deploys what changed since the last successful deploy (see .github/scripts/changes.sh):
# new migrations run Flyway, API changes redeploy Render, UI changes publish the website, docs changes do nothing.
# Order matters: database first, then the API (which expects the new schema), then the web app.
# Render's own auto-deploy must be OFF so the API only ever deploys after its migrations.
# Run it by hand (workflow_dispatch) to deploy everything.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.c.outputs.api }}
      db: ${{ steps.c.outputs.db }}
      web_deploy: ${{ steps.c.outputs.web_deploy }}
      puzzles: ${{ steps.c.outputs.puzzles }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: c
        run: .github/scripts/changes.sh deploy
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}

  migrate:
    name: Migrate database (Flyway to Neon)
    needs: changes
    if: needs.changes.outputs.db == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Flyway migrate
        run: >
          docker run --rm -v "${{ github.workspace }}/db/migrations:/flyway/sql:ro"
          flyway/flyway:11
          -url="${{ secrets.FLYWAY_URL }}" -user="${{ secrets.FLYWAY_USER }}" -password="${{ secrets.FLYWAY_PASSWORD }}"
          -connectRetries=10 migrate

  puzzles:
    name: Load upcoming daily puzzles
    needs: [changes, migrate]
    # The database step may be skipped (no new migration); a failed one still stops the rest.
    if: ${{ !cancelled() && needs.migrate.result != 'failure' && needs.changes.outputs.puzzles == 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # Safe on every deploy: days that already exist are never changed. This keeps the daily screen from ever
      # running dry if the weekly "Puzzle batch" has not run yet.
      - name: Generate and load puzzles
        working-directory: tools/generators/words
        env:
          PUZZLE_SEED: ${{ secrets.PUZZLE_SEED }}
          DATABASE_URL: ${{ secrets.PUZZLE_DATABASE_URL }}
        run: |
          node schedule.mjs --days 21 > puzzles.sql
          PUZZLE_SEED="$PUZZLE_SEED" node ../puzzles/schedule-puzzles.mjs --days 21 >> puzzles.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f puzzles.sql

  api:
    name: Deploy API (Render)
    needs: [changes, migrate]
    # The database step may be skipped (no new migration); a failed one still stops the rest.
    if: ${{ !cancelled() && needs.migrate.result != 'failure' && needs.changes.outputs.api == 'true' }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy hook
        run: curl --fail-with-body -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  web:
    name: Deploy web (Cloudflare Pages)
    needs: [changes, migrate]
    # The database step may be skipped (no new migration); a failed one still stops the rest.
    if: ${{ !cancelled() && needs.migrate.result != 'failure' && needs.changes.outputs.web_deploy == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Create the Pages project if it does not exist yet
        # Idempotent: on later runs the project exists and this step does nothing.
        run: npx wrangler@4 pages project create zenigma --production-branch=main || echo "Project already exists (or see the publish step for the real error)."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publish to Cloudflare Pages
        run: npx wrangler@4 pages deploy dist/web/browser --project-name=zenigma --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
