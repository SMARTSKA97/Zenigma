name: CI

on:
  push:
    branches: [main, phase-*]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Only the parts a push touched are checked (see .github/scripts/changes.sh): a UI change skips the API and the database,
# a docs change skips everything. Every job has a time limit, so a stuck run ends instead of hanging.
jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.c.outputs.api }}
      web: ${{ steps.c.outputs.web }}
      puzzles: ${{ steps.c.outputs.puzzles }}
      android: ${{ steps.c.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: c
        run: .github/scripts/changes.sh ci
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

  api:
    name: API (build, migrate, test)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust # throwaway container, reachable only from this job
          POSTGRES_DB: zenigma
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZENIGMA_TEST_DB: Host=localhost;Port=5432;Database=zenigma;Username=postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: apps/api/global.json
      - name: Apply migrations with Flyway
        run: >
          docker run --rm --network host -v "${{ github.workspace }}/db/migrations:/flyway/sql:ro"
          flyway/flyway:11 -url=jdbc:postgresql://localhost:5432/zenigma -user=postgres migrate
      - run: .github/scripts/run-annotated.sh dotnet build apps/api/Zenigma.slnx -c Release
      # Fails the build when a NuGet package (direct or indirect) has a known vulnerability.
      - name: Check NuGet packages for known vulnerabilities
        run: |
          dotnet list apps/api/Zenigma.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then echo "Vulnerable NuGet packages found"; exit 1; fi
      - run: .github/scripts/run-annotated.sh dotnet test apps/api/Zenigma.slnx -c Release --no-build

  puzzles:
    name: Puzzle generators (levels and vectors are up to date)
    needs: changes
    if: needs.changes.outputs.puzzles == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # The levels shipped in the app and the API, and the shared test vectors, are generated. Levels grow every week, so
      # this checks the packs are complete and regenerates a sample of levels to prove they still match. If the generators
      # change, regenerate them (npm run levels -- --all / npm run vectors in tools/generators/puzzles) and commit.
      - working-directory: tools/generators/puzzles
        run: |
          node build-levels.mjs --verify
          node gen-vectors.mjs
      - run: git diff --exit-code -- apps tests

  web:
    name: Web (test, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Fails the build on a known high or critical vulnerability in what ships to players.
      - run: npm audit --omit=dev --audit-level=high
      - run: npx ng test --watch=false
      - run: npm run build

  android:
    name: Android (debug build)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Accept Android SDK licenses and install platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build web assets and sync into the Android project
        working-directory: apps/web
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Assemble debug APK
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ../../../.github/scripts/run-annotated.sh ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zenigma-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
