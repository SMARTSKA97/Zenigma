name: CodeQL

# Static analysis for security bugs (injection, unsafe data flow, weak crypto) in the API, and the web app.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: apps/api/global.json
      - uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'javascript-typescript' && 'none' || 'manual' }}
      - if: matrix.language == 'csharp'
        run: dotnet build apps/api/Zenigma.Api/Zenigma.Api.csproj -c Release
      - uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          category: /language:${{ matrix.language }}
