<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Zenigma</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#f2f4f3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1012" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zenigma" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html { background: #f2f4f3; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #0b1012; } }
      html[data-theme='dark'] { background: #0b1012; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; color: #0f1618; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) .boot { color: #eef2f1; } }
      html[data-theme='dark'] .boot { color: #eef2f1; }
      .boot .mark { display: grid; grid-template: repeat(3, 14px) / repeat(3, 14px); gap: 4px; }
      .boot i { border-radius: 28%; background: currentColor; animation: boot 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
      .boot i:nth-child(1) { grid-area: 1 / 1; } .boot i:nth-child(2) { grid-area: 1 / 2; animation-delay: .09s; }
      .boot i:nth-child(3) { grid-area: 1 / 3; animation-delay: .18s; } .boot i:nth-child(4) { grid-area: 2 / 2; animation-delay: .27s; }
      .boot i:nth-child(5) { grid-area: 3 / 1; animation-delay: .36s; } .boot i:nth-child(6) { grid-area: 3 / 2; animation-delay: .45s; }
      .boot i:nth-child(7) { grid-area: 3 / 3; animation-delay: .54s; }
      @keyframes boot { 0%, 60%, 100% { transform: scale(1); opacity: 1; } 30% { transform: scale(.45); opacity: .35; } }
    </style>
    <meta name="description" content="Daily puzzles and endless levels: Crowns, Eclipse, Sudoku, Zipline, Patchwork and Word Guess. Works offline." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Zenigma" />
  <meta property="og:title" content="Zenigma: daily puzzles, played anywhere" />
  <meta property="og:description" content="Crowns, Eclipse, Sudoku, Zipline, Patchwork and Word Guess. A new daily challenge every day, endless practice levels, works offline." />
  <meta property="og:image" content="https://zenigma.ska97homelab.uk/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
</head>
  <body>
    <app-root>
      <!-- Shown instantly while the app starts; Angular replaces it. -->
      <div class="boot" role="status" aria-label="Loading Zenigma">
        <div class="mark"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
    </app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
