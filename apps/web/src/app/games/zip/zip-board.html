<div
  class="grid"
  role="application"
  [attr.aria-label]="description()"
  tabindex="0"
  [style.--n]="puzzle().size"
  [class.win]="solved()"
  (pointerdown)="down($event)"
  (pointermove)="move($event)"
  (pointerup)="up($event)"
  (pointercancel)="up($event)"
  (contextmenu)="$event.preventDefault()"
  (keydown)="key($event)"
>
  @for (cell of cells(); track cell.i) {
    <div class="cell" [attr.data-i]="cell.i" [class.on]="cell.on" [class.head]="cell.head" [class.hole]="cell.hole">
      @if (cell.number) {
        <b class="num" [class.reached]="cell.on">{{ cell.number }}</b>
      }
    </div>
  }
  <svg class="trail" [attr.viewBox]="'0 0 ' + puzzle().size + ' ' + puzzle().size" aria-hidden="true">
    <polyline [attr.points]="points()" />
    @if (head(); as h) {
      <circle [attr.cx]="h.x" [attr.cy]="h.y" r="0.2" />
    }
  </svg>
  @if (walls().length) {
    <svg class="walls" [attr.viewBox]="'0 0 ' + puzzle().size + ' ' + puzzle().size" aria-hidden="true">
      @for (w of walls(); track $index) {
        <line [attr.x1]="w.x1" [attr.y1]="w.y1" [attr.x2]="w.x2" [attr.y2]="w.y2" />
      }
    </svg>
  }
</div>
