<app-play-screen title="Switchyard" [subtitle]="'Round ' + round()">
  <div end>
    <span>{{ delivered() }} {{ delivered() === 1 ? 'train' : 'trains' }}</span>
    <span class="hearts" [attr.aria-label]="lives() + ' lives left'">{{ '♥'.repeat(lives()) }}<span class="gone">{{ '♥'.repeat(3 - lives()) }}</span></span>
  </div>
  <div class="queue" aria-label="Trains waiting to come in">
    <small>Next</small>
    @for (c of waiting().slice(0, 7); track $index) {
      <span class="chip c{{ c }}" aria-hidden="true">{{ symbols[c] }}</span>
    } @empty {
      <span class="none">none left</span>
    }
  </div>
  <svg class="yard" viewBox="0 0 100 130" role="group" aria-label="Rail yard. Tap a switch to choose the way trains go.">
    @for (e of edges(); track e.key) {
      <line class="rail" [class.on]="e.on" [attr.x1]="e.x1" [attr.y1]="e.y1" [attr.x2]="e.x2" [attr.y2]="e.y2" />
    }
    @for (n of nodes(); track n.id) {
      @if (n.colour !== null) {
        @let a = arrival();
        <g class="station c{{ n.colour }}" [class.ok]="a?.node === n.id && a?.ok" [class.bad]="a?.node === n.id && !a?.ok" [attr.transform]="'translate(' + n.x + ' ' + n.y + ')'">
          <rect x="-9.5" y="-6" width="19" height="12" rx="3" />
          <text y="2.6">{{ symbols[n.colour] }}</text>
        </g>
      } @else if (n.next.length === 2) {
        <g
          class="sw"
          role="button"
          tabindex="0"
          [attr.aria-label]="'Switch, set to the ' + (settings()[n.id] ? 'right' : 'left')"
          [attr.transform]="'translate(' + n.x + ' ' + n.y + ')'"
          (pointerdown)="flip(n.id, $event)"
          (keydown.enter)="flip(n.id, $event)"
          (keydown.space)="flip(n.id, $event)"
        >
          <circle class="hit" r="10" />
          <circle class="hub" r="3.6" />
        </g>
      } @else if (n.into === 2) {
        <rect class="joiner" x="-2.6" y="-2.6" width="5.2" height="5.2" rx="1" [attr.transform]="'translate(' + n.x + ' ' + n.y + ') rotate(45)'" />
      } @else if (n.layer === 0) {
        <g class="gate" [attr.transform]="'translate(' + n.x + ' ' + n.y + ')'">
          <rect x="-9" y="-6" width="18" height="9" rx="3" />
          <text y="0.8">IN</text>
        </g>
      } @else {
        <circle class="dot" [attr.cx]="n.x" [attr.cy]="n.y" r="1.4" />
      }
    }
    @for (t of trainViews(); track t.id) {
      <g class="train c{{ t.colour }}" [attr.transform]="'translate(' + t.x + ' ' + t.y + ')'">
        <rect x="-3.8" y="-3.8" width="7.6" height="7.6" rx="2.2" />
        <text y="1.9">{{ symbols[t.colour] }}</text>
      </g>
    }
  </svg>
  <p class="note" aria-live="polite">{{ note() }}</p>
</app-play-screen>
