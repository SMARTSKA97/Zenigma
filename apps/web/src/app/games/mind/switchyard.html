<app-play-screen title="Switchyard" [subtitle]="'Round ' + round()">
  <div end>
    <span>{{ delivered() }} {{ delivered() === 1 ? 'train' : 'trains' }}</span>
    <span class="hearts" [attr.aria-label]="lives() + ' lives left'">{{ '♥'.repeat(lives()) }}<span class="gone">{{ '♥'.repeat(3 - lives()) }}</span></span>
  </div>
  <div class="queue" aria-label="Trains waiting to come in">
    <small>Next</small>
    @for (c of waiting().slice(0, 7); track $index) {
      <span class="chip c{{ c }}" aria-hidden="true">{{ symbols[c] }}</span>
    } @empty {
      <span class="none">none left</span>
    }
  </div>
  <div class="stage" [class.hurt]="hurt()" [style.width.px]="area().w" [style.height.px]="area().h">
    <canvas #yard class="yard" role="group" aria-label="Rail yard. Tap a round switch to choose the way trains go." (pointerdown)="tap($event)"></canvas>
    <!-- The switches again as buttons, for keyboards and screen readers. -->
    <div class="sr-only">
      @for (id of switches(); track id) {
        <button type="button" (click)="flip(id)">Switch {{ $index + 1 }}, set to the {{ settings()[id] ? 'side' : 'straight' }} track</button>
      }
    </div>
  </div>
  <p class="note" aria-live="polite">{{ note() }}</p>
</app-play-screen>
