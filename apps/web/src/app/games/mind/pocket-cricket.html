<app-play-screen title="Pocket Cricket" subtitle="5 outs · most runs wins">
  <div end><span>{{ runs() }} runs</span></div>
  <section class="cricket">
    <div class="board" role="status">
      <span class="stat"><small>Runs</small><b>{{ runs() }}</b></span>
      <span class="stat"><small>Overs</small><b>{{ balls() }}</b></span>
      <span class="stat">
        <small>Outs</small>
        <b class="wkts" [attr.aria-label]="outs() + ' of 5 out'">
          @for (i of outList; track i) { <i [class.out]="i < outs()"></i> }
        </b>
      </span>
    </div>
    <div class="lcd">
      <canvas #screen role="img" aria-label="Cricket. A batter's view of the ball coming down the pitch, then the field from above after a hit."></canvas>
      <p class="call" aria-live="assertive">{{ call() }}</p>
    </div>
  </section>
  <div dock class="pads">
    @if (view() === 'bat') {
      <button type="button" class="move" aria-label="Move the batter left" (pointerdown)="shift(-1)">◀</button>
      <button type="button" class="shotbtn" [disabled]="!canShoot()" (pointerdown)="hit()">Shot</button>
      <button type="button" class="move" aria-label="Move the batter right" (pointerdown)="shift(1)">▶</button>
    } @else {
      <button type="button" class="runbtn" [disabled]="!canRun()" (pointerdown)="run()">Run</button>
    }
  </div>
</app-play-screen>
