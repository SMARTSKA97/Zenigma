<div class="hud">
  <span class="hearts" [attr.aria-label]="lives() + ' hearts left'">{{ '♥'.repeat(lives()) }}<span class="gone">{{ '♥'.repeat(3 - lives()) }}</span></span>
  @if (timed()) {
    <span>{{ left() }}s</span>
  }
</div>
@if (timed()) {
  <div class="time"><i [style.width.%]="(left() / 60) * 100"></i></div>
}
<p class="sr-only" aria-live="polite">{{ score() }} points</p>
<div class="field-wrap" [class.boom]="boom()">
  <canvas
    #field
    class="field"
    width="320"
    height="480"
    aria-label="Swipe through the comets. Avoid the skulls."
    (pointerdown)="down($event)"
    (pointermove)="move($event)"
    (pointerup)="up()"
    (pointercancel)="up()"
    (lostpointercapture)="up()"
  ></canvas>
</div>
<p class="muted tip">Swipe through the comets. A skull or a missed comet costs a heart.</p>
