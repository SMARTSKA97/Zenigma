<span class="thumb" aria-hidden="true"></span>
@for (option of options(); track option.value) {
  <button
    type="button"
    role="radio"
    [attr.aria-checked]="value() === option.value"
    [class.on]="value() === option.value"
    (click)="value.set(option.value)"
  >
    {{ option.label }}
  </button>
}
