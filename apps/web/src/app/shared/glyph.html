<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
  @switch (game()) {
    @case ('word-guess') {
      <rect x="6" y="14" width="10" height="10" rx="2.5" fill="currentColor" stroke="none" />
      <rect x="19" y="14" width="10" height="10" rx="2.5" />
      <rect x="32" y="14" width="10" height="10" rx="2.5" />
      <rect x="6" y="27" width="10" height="10" rx="2.5" />
      <rect x="19" y="27" width="10" height="10" rx="2.5" fill="currentColor" stroke="none" />
    }
    @case ('queens') {
      <path d="M8 36 L6 16 L16 25 L24 11 L32 25 L42 16 L40 36 Z" />
      <path d="M8 41 H40" />
    }
    @case ('tango') {
      <circle cx="15" cy="24" r="9" fill="currentColor" stroke="none" />
      <circle cx="33" cy="24" r="9" />
    }
    @case ('sudoku') {
      <rect x="7" y="7" width="34" height="34" rx="5" />
      <path d="M18.5 7 V41 M29.5 7 V41 M7 18.5 H41 M7 29.5 H41" stroke-width="1.8" />
      <circle cx="24" cy="24" r="3" fill="currentColor" stroke="none" />
    }
    @case ('zip') {
      <path d="M9 11 H33 A6 6 0 0 1 33 23 H15 A6 6 0 0 0 15 35 H39" />
      <circle cx="9" cy="11" r="3.2" fill="currentColor" stroke="none" />
      <circle cx="39" cy="35" r="3.2" fill="currentColor" stroke="none" />
    }
    @case ('patches') {
      <rect x="6" y="6" width="22" height="20" rx="3" />
      <rect x="31" y="6" width="11" height="20" rx="3" fill="currentColor" stroke="none" />
      <rect x="6" y="29" width="11" height="13" rx="3" fill="currentColor" stroke="none" />
      <rect x="20" y="29" width="22" height="13" rx="3" />
    }
    @case ('pinpoint') {
      <circle cx="24" cy="24" r="17" />
      <circle cx="24" cy="24" r="9" />
      <circle cx="24" cy="24" r="2.6" fill="currentColor" stroke="none" />
    }
    @case ('crossclimb') {
      <path d="M14 6 V42 M34 6 V42 M14 14 H34 M14 24 H34 M14 34 H34" />
    }
    @case ('wend') {
      <path d="M8 38 C8 20 24 32 24 18 C24 6 40 14 40 10" />
      <circle cx="8" cy="38" r="3.2" fill="currentColor" stroke="none" />
      <circle cx="40" cy="10" r="3.2" />
    }
    @case ('comet-slice') {
      <circle cx="31" cy="17" r="8" fill="currentColor" stroke="none" />
      <path d="M26 22 L8 40 M23 14 L8 29 M34 25 L19 40" stroke-width="2" />
    }
    @default {
      <circle cx="16" cy="17" r="5" />
      <circle cx="32" cy="17" r="5" fill="currentColor" stroke="none" />
      <circle cx="16" cy="33" r="5" fill="currentColor" stroke="none" />
      <circle cx="32" cy="33" r="5" />
    }
  }
</svg>
