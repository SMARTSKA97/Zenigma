<h1>Challenges</h1>
<div class="tabs" role="tablist" aria-label="Challenge type">
  @for (t of tabs; track t.id) {
    <button type="button" role="tab" [attr.aria-selected]="tab() === t.id" (click)="pick(t.id)">{{ t.label }}</button>
  }
</div>
@switch (tab()) {
  @case ('mind') {
    <app-mind-daily-panel />
  }
  @case ('goals') {
    <app-challenges />
  }
  @default {
    <app-daily-hub />
    <app-word-daily-panel />
  }
}
